# Configure the LG290P03 as an RTKBase base station.
# Base mode enables RTCM MSM4 and RTCM 1005 output and disables NMEA output.
# Survey in the antenna position for at least one hour with a 1.2 m accuracy limit.
PQTMCFGSVIN,W,1,3600,1.2,0,0,0
PQTMCFGRCVRMODE,W,2
# Keep NMEA time and fix sentences available to GPSD and Chrony.
PQTMCFGMSGRATE,W,GGA,1
PQTMCFGMSGRATE,W,RMC,1
PQTMCFGMSGRATE,W,ZDA,1
PQTMSAVEPAR
PQTMSRR
