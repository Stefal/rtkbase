# ------------------------------------------------------------
# Network state machine configuration
# ------------------------------------------------------------

# Enable automatic router mode (SHARED)
ENABLE_SHARED_IF_NO_DHCP=1

# Anti-flapping stability threshold
STABLE_THRESHOLD=3

# Debug mode (0/1)
DEBUG=0

# Log file
LOG_FILE="/var/log/net-state.log"

# Optional interface override (else auto-detect recommended)
# IFACE="eth0"